name: bench

# Three PR sizes (100, 1,000 and 5,000 changed files) on three operating systems, with the budget enforced:
#   100 files under 5 s, 1,000 under 30 s, 5,000 under 120 s (median wall of 3 runs), peak RSS under 1.5 GB,
#   and generating the 5,000 file repository must not take longer than checking it (bench/run.ts fails the
#   job otherwise). Generation is about 4 s against a check of a minute or more, so the repositories are not
#   cached; bench/run.ts has --reuse and a generator hash if that ever changes.
# Runner minutes: ubuntu on every matching pull request; windows and macos on push to main, on manual
# dispatch, and on pull requests that carry the label "bench".
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'packages/**'
      - 'bench/**'
      - '.github/workflows/bench.yml'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per size (the median is checked against the budget)
        type: number
        default: 3

concurrency:
  group: bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Pick the operating systems
        id: matrix
        env:
          EVENT: ${{ github.event_name }}
          HAS_BENCH_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'bench') }}
        run: |
          if [ "$EVENT" = "pull_request" ] && [ "$HAS_BENCH_LABEL" != "true" ]; then
            echo 'matrix={"os":["ubuntu-latest"]}' >> "$GITHUB_OUTPUT"
            echo "Pull request without the bench label: ubuntu only." >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'matrix={"os":["ubuntu-latest","windows-latest","macos-latest"]}' >> "$GITHUB_OUTPUT"
          fi

  bench:
    name: bench (${{ matrix.os }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsc -b
      - name: Pick a network sandbox for the check step
        id: sandbox
        if: runner.os == 'Linux'
        run: |
          if unshare -rn true 2>/dev/null; then
            echo "prefix=unshare -rn" >> "$GITHUB_OUTPUT"
            echo "sandbox: unshare -rn (user and network namespace, no network)" >> "$GITHUB_STEP_SUMMARY"
          elif sudo -n unshare -n true 2>/dev/null; then
            echo "prefix=sudo -n --preserve-env unshare -n -- sudo -n --preserve-env -u $USER" >> "$GITHUB_OUTPUT"
            echo "sandbox: sudo unshare -n (network namespace, no network)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "prefix=" >> "$GITHUB_OUTPUT"
            echo "sandbox: none available, the check step ran with network access" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Benchmark (100 under 5 s, 1,000 under 30 s, 5,000 under 120 s, RSS under 1.5 GB)
        env:
          # Through the environment: an empty command line argument does not survive pnpm on Windows.
          BENCH_PREFIX: ${{ steps.sandbox.outputs.prefix }}
          BENCH_RUNS: ${{ inputs.runs || 3 }}
        run: |
          set -o pipefail
          mkdir -p bench-out
          pnpm bench --no-build --enforce \
            --runs "$BENCH_RUNS" \
            --out "bench-out/results-$RUNNER_OS.json" \
            --summary "bench-out/summary-$RUNNER_OS.md" | tee "bench-out/output-$RUNNER_OS.txt"

      - name: Job summary
        if: always()
        run: |
          if [ -f "bench-out/summary-$RUNNER_OS.md" ]; then
            cat "bench-out/summary-$RUNNER_OS.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No benchmark summary was written, see the step log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results-${{ runner.os }}
          path: bench-out/
          if-no-files-found: warn
