# Release: on a v* tag, check, bundle the Action into dist/, commit dist on the tag and move the
# major tag (v0), prove the npm package installs and runs on its own (pack:check), publish
# `testwitness` to npm and create the GitHub release.
#
# The same workflow runs as a dry run on pull requests that change the release path and by hand
# (workflow_dispatch): every step runs except the tag push, the attestation, the publish
# (npm publish --dry-run instead) and the GitHub release, so a broken release is found before a
# tag is pushed. The dry run uses the version in packages/cli/package.json as the tag.
#
# The FIRST npm publish (0.1.0) is manual: npm cannot attach a trusted publisher to a package
# that does not exist yet. Until then the publish step says so and skips (scripts/release-npm.sh).
name: release
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release-*.sh
      - scripts/bundle-action.mjs
      - scripts/pack-check.mjs
      - action.yml
      - packages/cli/package.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      DRY_RUN: ${{ github.event_name == 'push' && '0' || '1' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm bundle:action
      - name: Tag to release
        id: tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else echo "tag=v$(node -p "require('./packages/cli/package.json').version")" >> "$GITHUB_OUTPUT"; fi
      - name: Commit dist on the tag and move the major tag
        run: scripts/release-dist.sh "$TAG"
        env:
          TAG: ${{ steps.tag.outputs.tag }}
      - uses: actions/attest-build-provenance@v4
        if: env.DRY_RUN == '0'
        with:
          subject-path: dist/index.js
      # Bundles packages/cli, packs it, installs the tarball with plain npm and runs a check.
      - run: pnpm pack:check
      - name: Publish npm package with provenance (trusted publishing)
        run: scripts/release-npm.sh
      - name: GitHub release
        if: env.DRY_RUN == '0'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
