# Release: on a v* tag, check, bundle the Action into dist/, prove the npm package
# installs and runs on its own (pack:check), then publish `testwitness` to npm.
#
# The FIRST npm publish (0.1.0) is manual: npm cannot attach a trusted publisher to a
# package that does not exist yet, so the maintainer runs `npm publish --access public`
# from packages/cli (after `pnpm pack:check`), then configures this workflow as the
# trusted publisher on npmjs.com. From then on this workflow publishes with OIDC and
# provenance, and skips the publish step when the tagged version is already on npm.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm bundle:action
      - name: Commit dist on the tag and move the major tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist
          git commit -m "build: dist for ${GITHUB_REF_NAME}" || true
          git tag -f "${GITHUB_REF_NAME}"
          MAJOR="${GITHUB_REF_NAME%%.*}"
          git tag -f "$MAJOR"
          git push -f origin "${GITHUB_REF_NAME}" "$MAJOR"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/index.js
      # Bundles packages/cli, packs it, installs the tarball with plain npm and runs a check.
      - run: pnpm pack:check
      - name: Publish npm package with provenance (trusted publishing)
        working-directory: packages/cli
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$(npm view "testwitness@${VERSION}" version 2>/dev/null)" = "${VERSION}" ]; then
            echo "testwitness@${VERSION} already published, skipping"
          else
            npm publish --provenance --access public
          fi
      - name: GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
