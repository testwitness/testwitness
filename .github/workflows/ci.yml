name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # The published CLI claims Node 20 or newer. Development needs Node 22 (Stryker 10),
  # so this job builds on 22, then installs the packed tarball and runs it on Node 20.
  cli-node20:
    name: cli on node 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsc -b
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: node -v
      # The workspace manifest says Node 22 and .npmrc is engine strict, which is right for
      # development. This step deliberately runs the packed CLI on Node 20, so the strict
      # check is lifted for this one command only.
      - run: pnpm pack:check
        env:
          npm_config_engine_strict: "false"

  # Single status for branch protection: green only when every matrix job is green.
  check:
    name: check
    needs: [test, cli-node20]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: all jobs passed
        run: |
          echo "test: ${{ needs.test.result }}"
          echo "cli-node20: ${{ needs.cli-node20.result }}"
          test "${{ needs.test.result }}" = "success" && test "${{ needs.cli-node20.result }}" = "success"
