name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # The published CLI claims Node 20 or newer. Development needs Node 22 (Stryker 10, and
  # the workspace is engine strict), so pnpm and the build stay on 22 and only the installed
  # CLI is executed with Node 20 (scripts/pack-check.mjs honours PACK_CHECK_NODE).
  cli-node20:
    name: cli on node 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: remember the Node 20 binary
        run: |
          node -v
          echo "PACK_CHECK_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: node -v && "$PACK_CHECK_NODE" -v
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsc -b
      - run: pnpm pack:check

  # Single status for branch protection: green only when every matrix job is green.
  check:
    name: check
    needs: [test, cli-node20]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: all jobs passed
        run: |
          echo "test: ${{ needs.test.result }}"
          echo "cli-node20: ${{ needs.cli-node20.result }}"
          test "${{ needs.test.result }}" = "success" && test "${{ needs.cli-node20.result }}" = "success"
