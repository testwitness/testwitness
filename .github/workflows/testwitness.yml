# Dogfood: testwitness runs on its own pull requests in strict mode, and on every push to main to record the run
# history that later pull requests read (docs/history.md).
name: testwitness
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
  # Read the testwitness-history artifact of the latest successful run on main.
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run --project unit --reporter=default --reporter=junit --outputFile=junit.xml
      - run: pnpm bundle:action
      - name: testwitness (self)
        uses: ./
        with:
          junit: junit.xml
          mode: strict
          fail_on: high
          history_artifact: testwitness-history
          # Uploads on push to main by default; pull requests only read.
          history_write: ${{ github.event_name == 'push' }}
