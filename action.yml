name: testwitness
description: Did this PR weaken its tests, and did they actually run? Reads the diff, the test code and the test results (JUnit XML, TAP or a JSON reporter). Java, TypeScript, JavaScript and Python. No model, no secrets. The only network calls go to the GitHub API, for the optional comment and run history.
author: Sajjad Hossain
branding:
  icon: eye
  color: gray-dark
inputs:
  results:
    description: Comma separated globs of the test results written by the test job. JUnit XML first; TAP and the JSON output of Jest, Vitest, pytest-json-report and Playwright are read too, told apart by content. When empty, the junit input is used
    required: false
  junit:
    description: Older name of the results input, still read when results is empty. Its default globs match the usual JUnit XML locations
    required: false
    default: "**/junit*.xml,**/TEST-*.xml,**/test-results/**/*.xml,**/surefire-reports/*.xml,**/failsafe-reports/*.xml"
  coverage:
    description: Comma separated globs of lcov, Cobertura or JaCoCo coverage reports from the head run (optional; enables V008)
    required: false
  mutation:
    description: Comma separated globs of Stryker JSON or PIT mutations.xml reports written by the opt in mutation job (optional; enables M001 and M002 and measures O001 and O002). The Action never runs a mutation tool itself; see docs/mutation-on-request.md
    required: false
  base:
    description: Base ref or sha (default is the pull request base)
    required: false
  head:
    description: Head ref or sha (default is the pull request head)
    required: false
  mode:
    description: report, require-ack or strict (overrides .testwitness.yml)
    required: false
  fail_on:
    description: high, medium or low (overrides .testwitness.yml)
    required: false
  config:
    description: Path to .testwitness.yml (default reads it from the base ref). A path inside the repository is read at the base ref too, never from the pull request
    required: false
  comment:
    description: Post or update one PR comment when the token can write (true or false)
    required: false
    default: "true"
  token:
    description: Token for the PR comment. Optional. Defaults to GITHUB_TOKEN. Never required for the check itself.
    required: false
  output_dir:
    description: Directory for testwitness.json, testwitness.md and testwitness-history.json
    required: false
    default: "."
  history:
    description: Path to a run history JSON file to read instead of downloading the artifact (optional)
    required: false
  history_artifact:
    description: Name of the run history artifact. On pull_request it is downloaded from the latest successful run of this workflow on the base branch (needs actions read permission; fork pull requests may not have it). Empty turns history off.
    required: false
    default: "testwitness-history"
  history_write:
    description: Upload the updated history as the history_artifact artifact, kept 90 days (true or false). Always true on a push to the default branch.
    required: false
    default: "false"
outputs:
  state:
    description: pass, review or unreadable
  report:
    description: Path to testwitness.json
  findings_high:
    description: Number of open high severity findings
  findings_medium:
    description: Number of open medium severity findings
  history:
    description: Path to testwitness-history.json, the run history with this run merged in (set when results or a history were read)
runs:
  using: node24
  main: dist/index.js
