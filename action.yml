name: testwitness
description: Did this PR weaken its tests, and did they actually run? Reads the diff, the test code and the test results (JUnit XML, TAP or a JSON reporter). Java, TypeScript, JavaScript and Python. No model, no secrets. The only network calls go to the GitHub API, for the optional comment.
author: Sajjad Hossain
branding:
  icon: eye
  color: gray-dark
inputs:
  results:
    description: Comma separated globs of the test results written by the test job. JUnit XML first; TAP and the JSON output of Jest, Vitest, pytest-json-report and Playwright are read too, told apart by content. When empty, the junit input is used
    required: false
  junit:
    description: Older name of the results input, still read when results is empty. Its default globs match the usual JUnit XML locations
    required: false
    default: "**/junit*.xml,**/TEST-*.xml,**/test-results/**/*.xml,**/surefire-reports/*.xml,**/failsafe-reports/*.xml"
  coverage:
    description: Comma separated globs of lcov, Cobertura or JaCoCo coverage reports from the head run (optional; enables V008)
    required: false
  base:
    description: Base ref or sha (default is the pull request base)
    required: false
  head:
    description: Head ref or sha (default is the pull request head)
    required: false
  mode:
    description: report, require-ack or strict (overrides .testwitness.yml)
    required: false
  fail_on:
    description: high, medium or low (overrides .testwitness.yml)
    required: false
  config:
    description: Path to .testwitness.yml (default reads it from the base ref). A path inside the repository is read at the base ref too, never from the pull request
    required: false
  comment:
    description: Post or update one PR comment when the token can write (true or false)
    required: false
    default: "true"
  token:
    description: Token for the PR comment. Defaults to the workflow's GITHUB_TOKEN. Never required for the check itself.
    required: false
    default: ${{ github.token }}
  output_dir:
    description: Directory for testwitness.json and testwitness.md
    required: false
    default: "."
outputs:
  state:
    description: pass, review or unreadable
  report:
    description: Path to testwitness.json
  findings_high:
    description: Number of open high severity findings
  findings_medium:
    description: Number of open medium severity findings
runs:
  using: node24
  main: dist/index.js
