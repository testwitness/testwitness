# testwitness mutation on request. Read docs/mutation-on-request.md before you add this file.
#
# THIS WORKFLOW RUNS THE PULL REQUEST'S CODE: its tests, under a mutation tool. The testwitness Action never does;
# this is the one opt in place where code from a pull request executes, so it is gated three ways:
#   1. it starts only on a comment that is `/testwitness mutate` on a line of its own;
#   2. the gate job checks through the REST API that the commenter has write permission on this repository;
#   3. on a pull request from a fork the comment must also name the head commit the maintainer reviewed,
#      `/testwitness mutate <at least 12 characters of the head sha>` (7 can be matched by a forged commit pushed after
#      the review), and the mutation job checks out exactly that commit.
# The gate is the protection. The job that runs the code also has a read only token, no secrets and no persisted git
# credentials, and the job that comments never runs the pull request's code; it only reads the reports with the
# testwitness Action. Leaving out caching does NOT prevent cache poisoning by itself: code running in an issue_comment
# workflow is in the default branch's cache scope and can reach the cache service with the runner's own credentials.
# Only ask for a run on code you would run in your default branch's CI.
#
# To use it: copy this file to .github/workflows/testwitness-mutate.yml, keep ONE of the tool blocks in the mutate job
# (StrykerJS or PIT) and delete the other, and adjust the install and test commands to your project.
name: testwitness mutate

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: testwitness-mutate-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  gate:
    # A cheap prefilter; the script below parses the comment properly. Nothing from the comment reaches a shell.
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/testwitness mutate')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      base: ${{ steps.check.outputs.base }}
      head: ${{ steps.check.outputs.head }}
    steps:
      - id: check
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const comment = context.payload.comment;
            let wanted;
            for (const line of String(comment.body || '').split(/\r?\n/)) {
              const m = /^\s*\/testwitness\s+mutate(?:\s+([0-9a-f]{7,40}))?\s*$/i.exec(line);
              if (m) { wanted = { sha: m[1] ? m[1].toLowerCase() : undefined }; break; }
            }
            if (!wanted) { core.setFailed('The comment is not a /testwitness mutate command.'); return; }
            const login = comment.user.login;
            const { data: level } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username: login });
            if (!['admin', 'write'].includes(level.permission)) {
              core.setFailed(`${login} has ${level.permission} permission; /testwitness mutate needs write.`);
              return;
            }
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: context.payload.issue.number });
            if (pr.state !== 'open') { core.setFailed('The pull request is not open.'); return; }
            const fork = !pr.head.repo || pr.head.repo.full_name !== `${owner}/${repo}`;
            if (fork && (!wanted.sha || wanted.sha.length < 12)) {
              core.setFailed(`Pull request from a fork: review the head commit, then comment /testwitness mutate ${pr.head.sha.slice(0, 12)} to run its code.`);
              return;
            }
            if (wanted.sha && !pr.head.sha.startsWith(wanted.sha)) {
              core.setFailed(`The head moved to ${pr.head.sha.slice(0, 12)} after the comment named ${wanted.sha}; review it and comment again.`);
              return;
            }
            core.setOutput('base', pr.base.sha);
            core.setOutput('head', pr.head.sha);

  mutate:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Read only, and nothing else: this job executes the pull request's code.
    permissions:
      contents: read
    env:
      TW_BASE: ${{ needs.gate.outputs.base }}
      TW_HEAD: ${{ needs.gate.outputs.head }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.head }}
          fetch-depth: 0
          persist-credentials: false

      # No `cache:` on any setup step, so this job never restores a cache that later steps trust. That does not stop the
      # pull request's code from writing to the default branch cache scope; the gate above is what keeps it out.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # The plan reads git only: the changed production files and the settings that mutate just those.
      - name: Plan the mutation run
        run: npx --yes testwitness@0 mutate-plan --base "$TW_BASE" --head "$TW_HEAD" --format shell --out "$RUNNER_TEMP/plan.env" && cat "$RUNNER_TEMP/plan.env"

      # ---- Block 1: StrykerJS (TypeScript, JavaScript). Needs @stryker-mutator/core and the runner plugin for your
      # test tool (vitest-runner, jest-runner, mocha-runner) in devDependencies, with a stryker config that names it.
      - name: Install
        run: npm ci
      - name: Tests with JUnit XML (so the comment keeps its test evidence)
        run: npx vitest run --reporter=default --reporter=junit --outputFile=testwitness-results/junit.xml || true
      - name: Mutate the changed lines with StrykerJS
        run: |
          . "$RUNNER_TEMP/plan.env"
          if [ -z "$STRYKER_MUTATE" ]; then echo "No TypeScript or JavaScript production line changed."; exit 0; fi
          # --incremental only helps when reports/stryker-incremental.json is restored from a trusted run (an artifact
          # of the default branch), never from a cache this job writes.
          npx stryker run --mutate "$STRYKER_MUTATE" --incremental --coverageAnalysis perTest --reporters json,clear-text
          mkdir -p testwitness-results && cp "$STRYKER_REPORT" testwitness-results/

      # ---- Block 2: PIT (Java, Maven). Needs org.pitest:pitest-maven with the pitest-junit5-plugin dependency in the
      # pom (fixtures/java-junit5-maven/project/pom.xml shows the plugin block). Gradle: the gradle-pitest-plugin with
      # the same targetClasses and targetTests, and outputFormats XML.
      # - uses: actions/setup-java@v4
      #   with:
      #     distribution: temurin
      #     java-version: 21
      # - name: Mutate the changed classes with PIT
      #   run: |
      #     . "$RUNNER_TEMP/plan.env"
      #     if [ -z "$PIT_TARGET_CLASSES" ]; then echo "No Java production file changed."; exit 0; fi
      #     mvn -B test org.pitest:pitest-maven:mutationCoverage -Dmaven.test.failure.ignore=true \
      #       -DtargetClasses="$PIT_TARGET_CLASSES" -DtargetTests="$PIT_TARGET_TESTS" \
      #       -DoutputFormats=XML -DtimestampedReports=false -DfullMutationMatrix=true
      #     mkdir -p testwitness-results && cp "$PIT_REPORT" testwitness-results/ && cp target/surefire-reports/TEST-*.xml testwitness-results/

      # ---- No mutmut block: mutmut results carry no line numbers and no killing tests, so testwitness cannot read
      # them (docs/mutation-on-request.md).

      - uses: actions/upload-artifact@v4
        with:
          name: testwitness-mutation
          path: testwitness-results/
          if-no-files-found: warn
          retention-days: 7

  report:
    needs: [gate, mutate]
    runs-on: ubuntu-latest
    # This job can write the comment, so it never runs the pull request's code: it only reads the reports.
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: testwitness-mutation
          path: ${{ runner.temp }}/testwitness-mutation
      # Pin the published Action by tag or sha. Never `uses: ./` here: that would run the pull request's copy.
      - uses: testwitness/testwitness@v0
        with:
          base: ${{ needs.gate.outputs.base }}
          head: ${{ needs.gate.outputs.head }}
          junit: ${{ runner.temp }}/testwitness-mutation/**/junit*.xml,${{ runner.temp }}/testwitness-mutation/**/TEST-*.xml
          mutation: ${{ runner.temp }}/testwitness-mutation/**/*.json,${{ runner.temp }}/testwitness-mutation/**/mutations.xml
          output_dir: ${{ runner.temp }}
